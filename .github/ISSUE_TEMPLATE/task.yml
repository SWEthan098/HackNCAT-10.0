name: Task
description: One unit of hackathon work (half a day or less)
labels: [task]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this task delivers, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable conditions. Link the PROJECT_SPEC.md criterion this serves.
      placeholder: |
        - [ ] ...
        - [ ] Tests added (pytest for API, Playwright for user flows)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [web, api, database, ai, deployment, docs, demo]
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: Owner
      description: Who drives this task (see TEAM.md). Also assign them on the issue.
      options: [Lead, Miles, Daylen, JLee, Unassigned]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Files likely to change, dependencies on other issues, research links.
