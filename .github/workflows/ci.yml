name: CI

on:
  push:
    branches: [main, develop, "dev/**", "feature/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Also run the browser E2E suite against the real Supabase project (needs repo secrets)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, types, build, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Uses the public values committed in web/.env; no secrets involved.
      - run: npm run build
      - run: npx playwright test --project=unit

  api:
    name: API (lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # Tests use a fake database, locally signed tokens and the mock AI provider:
      # no network, no credentials.
      - run: pytest

  e2e:
    name: E2E (manual, real Supabase)
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    needs: [web, api]
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ALLOWED_ORIGINS: http://localhost:3000
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - name: Start API
        working-directory: api
        run: |
          pip install -r requirements.txt
          nohup uvicorn main:app --port 8000 > ../api.log 2>&1 &
      - name: Build and start web
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npm run start > ../web.log 2>&1 &
          npx --yes wait-on@8.0.3 http://localhost:3000 http://localhost:8000/health
      - name: Run E2E
        working-directory: web
        run: npx playwright test --project=e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug
          path: |
            web/test-results
            api.log
            web.log
